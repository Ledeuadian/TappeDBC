<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/tappe.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Tappe — Create, share, and manage your digital business card." />
    <!-- Security headers — helps mitigate XSS and keeps activation codes
         (passed as ?code= query params) out of Referer headers.
         Note: frame-ancestors is ignored in meta tags; configure it as a
         real header in vercel.json / your host when deploying. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" />
    <meta name="referrer" content="no-referrer" />
    <title>Tappe — Digital Business Card</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
